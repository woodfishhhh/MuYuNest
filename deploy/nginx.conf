server {
    listen 80;
    server_name img.woodfish.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name img.woodfish.site;

    ssl_certificate /etc/letsencrypt/live/img.woodfish.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.woodfish.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    autoindex off;

    location = /favicon.ico {
        alias /usr/share/nginx/html/newBlog/site-icons/image-bed.png;
        default_type image/png;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /o/ {
        alias /srv/muyu-images/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        proxy_pass http://172.18.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
}
