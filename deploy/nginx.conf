server {
    listen 80;
    server_name woodfish.site www.woodfish.site blog.woodfish.site
                pretext.woodfish.site weather.woodfish.site xcpc.woodfish.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# The apex is a compatibility router. Old deep links keep their path and query.
server {
    listen 443 ssl;
    server_name woodfish.site www.woodfish.site;

    ssl_certificate /etc/letsencrypt/live/woodfish.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woodfish.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /newBlog/sw.js {
        alias /usr/share/nginx/html/newBlog/legacy-newblog-sw.js;
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        add_header Expires 0;
    }

    location = /newBlog {
        return 308 https://blog.woodfish.site/$is_args$args;
    }

    location ~ ^/newBlog/(.*)$ {
        return 308 https://blog.woodfish.site/$1$is_args$args;
    }

    location = /pretext {
        return 308 https://pretext.woodfish.site/$is_args$args;
    }

    location ~ ^/pretext/(.*)$ {
        return 308 https://pretext.woodfish.site/$1$is_args$args;
    }

    location = /weather {
        return 308 https://weather.woodfish.site/$is_args$args;
    }

    location ~ ^/weather/(.*)$ {
        return 308 https://weather.woodfish.site/$1$is_args$args;
    }

    location = /xcpc-super-template {
        return 308 https://xcpc.woodfish.site/$is_args$args;
    }

    location ~ ^/xcpc-super-template/(.*)$ {
        return 308 https://xcpc.woodfish.site/$1$is_args$args;
    }

    location / {
        return 308 https://blog.woodfish.site$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name blog.woodfish.site;

    ssl_certificate /etc/letsencrypt/live/blog.woodfish.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.woodfish.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html/newBlog;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/x-javascript application/xml application/rss+xml
               application/atom+xml image/svg+xml font/ttf font/otf font/eot;

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        add_header Expires 0;
    }

    location = /registerSW.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        add_header Expires 0;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location = /api/visitor-count {
        proxy_pass http://172.18.0.1:3011/api/visitor-count;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /api/visitor-count/visit {
        proxy_pass http://172.18.0.1:3011/api/visitor-count/visit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|webp|gif|ico|svg|avif)$ {
        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(json|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

server {
    listen 443 ssl;
    server_name pretext.woodfish.site;

    ssl_certificate /etc/letsencrypt/live/pretext.woodfish.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pretext.woodfish.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/pretext;
    index index.html;
    gzip on;

    location = /pretext/favicon.svg {
        alias /usr/share/nginx/html/newBlog/site-icons/pretext.svg;
        default_type image/svg+xml;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /favicon.svg {
        alias /usr/share/nginx/html/newBlog/site-icons/pretext.svg;
        default_type image/svg+xml;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # The current bundle still references /pretext/assets/*.
    location ^~ /pretext/ {
        alias /usr/share/nginx/html/pretext/;
        try_files $uri $uri/ /pretext/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

