name: muyu-metrics-e2e
services:
  api:
    build: ../../services/api
    read_only: true
    tmpfs:
      - /srv/muyu-data:uid=65532,gid=65532
      - /srv/muyu-images:uid=65532,gid=65532
    environment:
      VISITOR_ANALYTICS_SECRET: metrics-e2e-secret
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4183
  web:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - 127.0.0.1:4183:80
    volumes:
      - ${METRICS_E2E_DIST:-../../apps/blog/dist}:/usr/share/nginx/html:ro
      - ../../server/analytics-dashboard:/metrics-dashboard:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./htpasswd:/etc/nginx/metrics.htpasswd:ro
