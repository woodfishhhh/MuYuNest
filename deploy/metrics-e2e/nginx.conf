events {}
http {
 include /etc/nginx/mime.types;
 server {
  listen 80;
  absolute_redirect off;
  root /usr/share/nginx/html;
  location / { try_files $uri $uri/ /index.html; }
  location = /api/analytics/collect { proxy_pass http://api:8080; }
  location /api/analytics/ {
   auth_basic "Metrics test";
   auth_basic_user_file /etc/nginx/metrics.htpasswd;
   proxy_pass http://api:8080;
  }
  location /api/visitor-count { proxy_pass http://api:8080; }
  location = /analytics { return 308 /analytics/; }
  location /analytics/ {
   auth_basic "Metrics test";
   auth_basic_user_file /etc/nginx/metrics.htpasswd;
   alias /metrics-dashboard/;
   index index.html;
   add_header Cache-Control "no-store";
  }
 }
}
