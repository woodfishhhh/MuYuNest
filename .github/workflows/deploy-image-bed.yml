name: Deploy Image Bed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-image-bed.yml"
      - "apps/image-bed-web/**"
      - "apps/image-bed-api/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - "patches/**"
      - "deploy/configure-blog-ssh.sh"
      - "deploy/blog-host-key.pub"
      - "deploy/image-bed/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

concurrency:
  group: image-bed-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify and build
        run: |
          pnpm install --frozen-lockfile
          pnpm shared:build
          pnpm image-bed:web:typecheck
          pnpm image-bed:web:test
          pnpm image-bed:web:build
          pnpm image-bed:api:typecheck
          pnpm image-bed:api:test
          pnpm image-bed:api:build
          cd apps/image-bed-web/dist
          printf '%s\n' "$GITHUB_SHA" > REVISION
          find . -type f ! -path ./release.manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > release.manifest.sha256

      - name: Configure runner-only GHCR push auth
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          umask 077
          config="$RUNNER_TEMP/image-bed-docker"
          mkdir "$config"
          jq -n '{auths: {"ghcr.io": {auth: ((env.GITHUB_ACTOR + ":" + env.GHCR_TOKEN) | @base64)}}}' > "$config/config.json"
          printf 'DOCKER_CONFIG=%s\n' "$config" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - name: Push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/image-bed-api/Dockerfile
          push: true
          build-args: RELEASE_SHA=${{ github.sha }}
          tags: |
            ghcr.io/woodfishhhh/muyu-image-bed-api:${{ github.sha }}
            ghcr.io/woodfishhhh/muyu-image-bed-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH with pinned host key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.IMAGE_BED_DEPLOY_SSH_KEY }}
        run: bash deploy/configure-blog-ssh.sh

      - name: Upload release to the restricted inbox
        timeout-minutes: 15
        env:
          SSH_DEST: imgbed-deploy@${{ secrets.SSH_HOST }}
        run: |
          rsync -rtz --delete --timeout=120 apps/image-bed-web/dist/ "$SSH_DEST:web/"
          printf '%s %s.%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/READY"
          rsync --timeout=60 "$RUNNER_TEMP/READY" "$SSH_DEST:READY"

      - name: Verify activation and live revisions
        timeout-minutes: 16
        run: |
          base=https://img.woodfish.site
          release="$GITHUB_SHA $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          status=""
          # A cold pull on the VPS can take several minutes before the API restarts.
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            if status=$(curl -fsS --max-time 5 "$base/admin/DEPLOY_STATUS?run=$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"); then
              case "$status" in
                "$release ok") break ;;
                "$release "*) echo "Host activation failed: $status" >&2; exit 1 ;;
              esac
            fi
            sleep 3
          done
          if [ "$status" != "$release ok" ]; then
            echo 'Host did not confirm activation; check journalctl -u image-bed-activate' >&2
            exit 1
          fi
          html=$(curl -fsS --max-time 10 "$base/admin/")
          grep -Fq '<title>Muyu Admin</title>' <<< "$html"
          grep -Fq '/admin/assets/' <<< "$html"
          test "$(curl -fsS --max-time 10 "$base/admin/REVISION?sha=$GITHUB_SHA")" = "$GITHUB_SHA"
          curl -fsS --max-time 10 "$base/api/health?sha=$GITHUB_SHA" |
            jq -e --arg sha "$GITHUB_SHA" '.db == "ok" and .service == "ok" and .revision == $sha'
