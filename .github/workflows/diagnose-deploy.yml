name: Diagnose Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure trusted SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash deploy/configure-blog-ssh.sh

      - name: Test SSH connectivity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          : "${SSH_USERNAME:?SSH_USERNAME is required}"
          timeout 30s ssh -T "$SSH_USERNAME@$SSH_HOST" "echo 'SSH OK'"
