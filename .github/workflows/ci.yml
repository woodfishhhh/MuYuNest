name: CI and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: Deploy the Vue SPA to /next/ instead of production
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: vue-three-blog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: API contract generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:generate
      - run: pnpm api:sqlc
      - run: pnpm -F @woodfish-nest/content-tools exec tsx src/export-render-metadata.ts --check
      - run: pnpm -F @woodfish-nest/content-tools exec tsx src/export-render-slugs.ts --check
      - run: pnpm -F @woodfish-nest/content-tools exec tsx src/export-render-sanitizer.ts --check
      - run: git diff --exit-code -- packages/api-contract/src services/api/internal/api services/api/internal/db services/api/internal/render/testdata

  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run
      - name: Test with race detector
        run: go test -race -cover ./...
      - name: Build container
        run: docker build -t muyu-api:test .

  verify-and-build:
    name: Verify and build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Verify deployment SSH configuration
        run: bash deploy/test-configure-blog-ssh.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test content tools
        run: pnpm content-tools:test

      - name: Test visitor counter and analytics
        run: python3 -m unittest discover -s tests/server -p 'test_*.py'

      - name: Restore generated content cache
        id: content-cache
        uses: actions/cache@v6
        with:
          path: |
            apps/blog/src/generated
            apps/blog/public/post-index.json
            apps/blog/public/content-assets
            apps/blog/public/imported-assets
            apps/blog/public/remote-assets
          key: content-gen-v1-${{ hashFiles('package.json', 'pnpm-workspace.yaml', 'apps/blog/package.json', 'apps/blog/content/source/myblog/**', 'apps/blog/content/posts/**', 'apps/blog/content/source/blog/source/_data/**', 'apps/blog/content/source/blog/_config.yml', 'packages/content-tools/src/**', 'packages/content-tools/package.json', 'pnpm-lock.yaml') }}

      - name: Generate content
        if: steps.content-cache.outputs.cache-hit != 'true'
        run: pnpm generate:content:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify docs navigation against generated content
        run: node deploy/verify-docs-content.mjs

      - name: Dist build
        run: pnpm -F @woodfish-nest/blog build:deploy:dist

      - name: Verify Vue migration
        env:
          VITE_BASE_URL: /next/
        run: |
          pnpm blog-web:typecheck
          pnpm blog-web:test
          pnpm -F @woodfish-nest/blog-web build
          pnpm -F @woodfish-nest/blog-web verify:dist --base-path /next/

      - name: Upload Vue preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: blog-web-dist
          path: apps/blog-web/dist
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Assemble verifiable static release
        run: bash deploy/assemble-static-release.sh "$GITHUB_SHA"

      - name: Upload blog dist artifact
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: blog-dist
          path: apps/blog/dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy-preview:
    name: Deploy Vue preview
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_preview
    needs: [verify-and-build, api, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: blog-web-dist
          path: apps/blog-web/dist
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash deploy/configure-blog-ssh.sh
      - name: Publish preview with rollback
        env:
          DEPLOY_REMOTE: ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}
          DEPLOY_DIR: /opt/blog-stack/sites/next
          DEPLOY_DIST_DIR: apps/blog-web/dist
          DEPLOY_SKIP_BUILD: '1'
          DEPLOY_CONTAINER: blog-nginx
          VITE_BASE_PATH: /next/
          DEPLOY_MOUNT_PATH: /next/
          DEPLOY_SITE_URL: https://blog.woodfish.site/next/
        run: bash deploy/deploy.sh

  deploy:
    name: Deploy to VPS
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.deploy_preview
    needs: verify-and-build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_BASE_PATH: /
      DEPLOY_URL: https://blog.woodfish.site/
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download blog dist artifact
        uses: actions/download-artifact@v4
        with:
          name: blog-dist
          path: apps/blog/dist

      - name: Verify dist artifact
        run: |
          test -f apps/blog/dist/index.html
          test -f apps/blog/dist/sw.js
          test -f apps/blog/dist/manifest.webmanifest
          test -d apps/blog/dist/assets
          test "$(cat apps/blog/dist/REVISION)" = "$RELEASE_SHA"
          (cd apps/blog/dist && sha256sum --strict --check --quiet release.manifest.sha256)

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.BLOG_DEPLOY_SSH_KEY }}
        run: bash deploy/configure-blog-ssh.sh

      # The key in BLOG_DEPLOY_SSH_KEY belongs to the host user `blog-deploy`, which can only
      # rsync into /opt/blog-stack/deploy-incoming/blog (rrsync). Writing READY triggers the
      # host's blog-activate.path: it copies the upload as root:root, re-checks REVISION and
      # release.manifest.sha256, rejects symlinks, and swaps it into /opt/blog-stack/sites/newBlog.
      # nginx config is no longer pushed from this workflow; it is managed on the host.
      - name: Upload release
        timeout-minutes: 20
        env:
          SSH_DEST: blog-deploy@${{ secrets.SSH_HOST }}
        run: |
          retry() {
            local attempt=1 delay=8
            until "$@"; do
              local exit_code=$?
              if [ "$attempt" -ge 5 ]; then
                return "$exit_code"
              fi
              echo "Command failed with exit code ${exit_code}; retrying in ${delay}s (${attempt}/5)" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry timeout 900s rsync \
            --recursive \
            --times \
            --no-owner \
            --no-group \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            --compress \
            --checksum \
            --delete \
            --partial-dir=.rsync-partial \
            --itemize-changes \
            --stats \
            --timeout=120 \
            apps/blog/dist/ \
            "$SSH_DEST:release/"

          printf '%s\n' "$RELEASE_SHA" > "$RUNNER_TEMP/READY"
          retry timeout 120s rsync --timeout=60 "$RUNNER_TEMP/READY" "$SSH_DEST:READY"

      - name: Smoke test live site
        run: |
          revision=""
          for _ in $(seq 1 40); do
            revision="$(curl -fsSL --max-time 15 "${DEPLOY_URL}REVISION" || true)"
            [ "$revision" = "$RELEASE_SHA" ] && break
            sleep 3
          done
          if [ "$revision" != "$RELEASE_SHA" ]; then
            echo "Host did not activate $RELEASE_SHA (live: ${revision:-nothing}). Check: journalctl -u blog-activate" >&2
            exit 1
          fi
          html="$(curl -fsSL "$DEPLOY_URL")"
          printf '%s' "$html" | grep -q "${VITE_BASE_PATH}assets/"
          if [ "$VITE_BASE_PATH" != "/" ] && printf '%s' "$html" | grep -q '"/assets/'; then
            echo "Live HTML still contains root-scoped /assets refs" >&2
            exit 1
          fi
