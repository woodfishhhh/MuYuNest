name: Friend Link Bot

on:
  issues:
    types:
      - opened
  schedule:
    # GitHub Actions uses UTC; 16:00 UTC is 00:00 in Asia/Shanghai.
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: friend-link-bot
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  friend-link-bot:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[Friend Link]')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for rendered link checks
        if: github.event_name != 'issues'
        run: pnpm -F @woodfish-nest/content-tools exec playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config user.name "woodfish-friend-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reply to new friend-link issue
        if: github.event_name == 'issues'
        run: pnpm -F @woodfish-nest/content-tools exec tsx src/friend-link-bot.ts opened

      - name: Review pending friend-link issues
        if: github.event_name != 'issues'
        run: pnpm -F @woodfish-nest/content-tools exec tsx src/friend-link-bot.ts review

      - name: Trigger CI for accepted friend links
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_SHA: ${{ github.sha }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" = "$INITIAL_SHA" ]; then
            echo "No friend-link commit was created; CI is not needed."
            exit 0
          fi

          echo "Friend-link bot created $current_sha; triggering CI for main."
          gh workflow run ci.yml --ref main
