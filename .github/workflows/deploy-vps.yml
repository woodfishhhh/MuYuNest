name: Deploy to VPS

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vue-three-blog-vps
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_BASE_PATH: /newBlog/
      DEPLOY_URL: https://woodfish.site/newBlog/
      DEPLOY_ARCHIVE: vue-three-blog-${{ github.run_id }}.tar.gz
      DEPLOY_REMOTE_ARCHIVE: /tmp/vue-three-blog-${{ github.run_id }}.tar.gz
      DEPLOY_REMOTE_ZIP: /tmp/vue-three-blog-${{ github.run_id }}.zip
      DEPLOY_REMOTE_CHUNKS: /tmp/vue-three-blog-${{ github.run_id }}-chunks
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/blog-stack/sites/newBlog' }}
      DEPLOY_CONTAINER: blog-nginx

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Download blog dist artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: blog-dist
          path: apps/blog/dist
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        if: github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile

      - name: Generate content
        if: github.event_name == 'workflow_dispatch'
        run: pnpm generate:content:ci

      - name: Typecheck
        if: github.event_name == 'workflow_dispatch'
        run: pnpm typecheck

      - name: Dist build
        if: github.event_name == 'workflow_dispatch'
        run: pnpm -F @woodfish-nest/blog build:deploy:dist

      - name: Upload blog dist artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: blog-dist
          path: apps/blog/dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Verify dist artifact
        run: |
          test -f apps/blog/dist/index.html
          test -f apps/blog/dist/sw.js
          test -f apps/blog/dist/manifest.webmanifest
          test -d apps/blog/dist/assets

      - name: Resolve blog dist artifact URL
        id: blog-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
        run: |
          artifact_id="$(
            gh api "repos/${{ github.repository }}/actions/runs/${ARTIFACT_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "blog-dist") | .id' \
              | head -n 1
          )"
          test -n "$artifact_id"

          download_url="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip"
          signed_url="$(
            curl -fsSIL \
              -o /dev/null \
              -w '%{url_effective}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$download_url"
          )"
          test "$signed_url" != "$download_url"

          {
            echo "url<<EOF"
            echo "$signed_url"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Download and stage site artifact
        timeout-minutes: 45
        env:
          ARTIFACT_URL: ${{ steps.blog-artifact.outputs.url }}
        run: |
          ssh_dest="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"
          remote_next="${{ env.DEPLOY_DIR }}.next.${{ github.run_id }}"
          remote_zip="${{ env.DEPLOY_REMOTE_ZIP }}"
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          artifact_url_b64="$(printf '%s' "$ARTIFACT_URL" | base64 -w0)"

          # shellcheck disable=SC2029
          timeout 60s ssh -T "${ssh_options[@]}" "$ssh_dest" "case '$remote_next' in /opt/blog-stack/sites/*.next.*) ;; *) echo 'Refusing unsafe staging dir: $remote_next' >&2; exit 2 ;; esac; rm -rf '$remote_next'; mkdir -p '$remote_next'; rm -f '$remote_zip'"

          # shellcheck disable=SC2029
          timeout 2700s ssh -T "${ssh_options[@]}" "$ssh_dest" "artifact_url=\"\$(printf '%s' '$artifact_url_b64' | base64 -d)\"; curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 2400 -o '$remote_zip' \"\$artifact_url\"; if command -v unzip >/dev/null 2>&1; then unzip -q '$remote_zip' -d '$remote_next'; else python3 -m zipfile -e '$remote_zip' '$remote_next'; fi; rm -f '$remote_zip'; test -f '$remote_next/index.html' && test -d '$remote_next/assets'"

      - name: Upload nginx config
        run: |
          timeout 60s scp \
            -o BatchMode=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            deploy/nginx.conf \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/tmp/default.conf"

      - name: Activate release
        run: |
          ssh "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" <<EOF
          set -eu

          archive="${{ env.DEPLOY_REMOTE_ARCHIVE }}"
          target_dir="${{ env.DEPLOY_DIR }}"
          base_path="${{ env.VITE_BASE_PATH }}"
          container="${{ env.DEPLOY_CONTAINER }}"
          config_path="/opt/blog-stack/nginx/conf.d/default.conf"
          config_backup="\${config_path}.bak.${{ github.run_id }}"
          next_dir="\${target_dir}.next.${{ github.run_id }}"
          backup_dir="\${target_dir}.bak.${{ github.run_id }}"

          rollback() {
            rm -rf "\$next_dir"
            rm -rf "\$target_dir"
            if [ -d "\$backup_dir" ]; then
              mv "\$backup_dir" "\$target_dir"
            fi
            if [ -f "\$config_backup" ]; then
              cat "\$config_backup" > "\$config_path"
              rm -f "\$config_backup"
            fi
            docker exec "\$container" nginx -s reload >/dev/null 2>&1 || true
          }

          case "\$target_dir" in
            /opt/blog-stack/sites/*) ;;
            *) echo "Refusing unsafe deploy dir: \$target_dir" >&2; exit 2 ;;
          esac

          cp "\$config_path" "\$config_backup"
          cat /tmp/default.conf > "\$config_path"
          if ! docker exec "\$container" nginx -t; then
            cat "\$config_backup" > "\$config_path"
            rm -f "\$config_backup"
            docker exec "\$container" nginx -s reload || true
            exit 1
          fi

          rm -rf "\$backup_dir"

          test -f "\$next_dir/index.html"
          test -f "\$next_dir/sw.js"
          test -f "\$next_dir/manifest.webmanifest"
          test -d "\$next_dir/assets"
          grep -q "\${base_path}assets/" "\$next_dir/index.html"
          if grep -q '"/assets/' "\$next_dir/index.html"; then
            echo "index.html contains root-scoped /assets refs" >&2
            exit 3
          fi

          if [ -d "\$target_dir" ]; then
            mv "\$target_dir" "\$backup_dir"
          fi

          mv "\$next_dir" "\$target_dir"
          chmod -R a+rX "\$target_dir"

          if ! docker exec "\$container" nginx -s reload; then
            rollback
            exit 1
          fi

          if ! docker exec "\$container" sh -c "test -f /usr/share/nginx/html\${base_path}index.html && grep -q '\${base_path}assets/' /usr/share/nginx/html\${base_path}index.html"; then
            rollback
            exit 1
          fi

          rm -f "\$archive"
          rm -rf "\$backup_dir"
          rm -f "\$config_backup"
          rm -f /tmp/default.conf
          EOF

      - name: Smoke test live site
        run: |
          html="$(curl -kfsSL "${{ env.DEPLOY_URL }}")"
          printf '%s' "$html" | grep -q "${{ env.VITE_BASE_PATH }}assets/"
          if printf '%s' "$html" | grep -q '"/assets/'; then
            echo "Live HTML still contains root-scoped /assets refs" >&2
            exit 1
          fi
