root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
entrypoint = ["./tmp/api"]
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "data"]
exclude_regex = ["_test\\.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[build.windows]
cmd = "go build -o ./tmp/api.exe ./cmd/api"
entrypoint = ["tmp\\api.exe"]
