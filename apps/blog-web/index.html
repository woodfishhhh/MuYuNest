    <style>
      :root { --stage-bg: #050510; --stage-fg: #f6f8ff; color-scheme: dark; }
      :root[data-theme="day"] { --stage-bg: #fafaf7; --stage-fg: #17191f; color-scheme: light; }
      body { background-color: var(--stage-bg); color: var(--stage-fg); margin: 0; }
      #app { min-height: 100vh; }
    </style>
    <script>
      (() => {
        let theme = "night";
        try { if (localStorage.getItem("vuecubeblog-theme") === "day") theme = "day"; }
        catch { /* Storage can be disabled; the default theme remains usable. */ }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === "day" ? "light" : "dark";
      })();
    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
