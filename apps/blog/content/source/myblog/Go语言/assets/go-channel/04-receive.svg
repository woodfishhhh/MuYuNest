<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1040" viewBox="0 0 1100 1040" role="img" aria-labelledby="title desc">
<title id="title">接收：先检查关闭，再决定从哪里取值</title><desc id="desc">接收先处理 nil 与关闭且空，再考虑等待发送者和缓冲值，无法完成时非阻塞返回失败，阻塞模式进入 recvq。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#a5b7cc"/></marker></defs>
<rect width="100%" height="100%" rx="20" fill="#f8fbff"/>
<g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<text x="40" y="58" font-size="34" fill="#172b4d" font-weight="700" text-anchor="start">接收：先检查关闭，再决定从哪里取值</text><text x="40" y="97" font-size="21" fill="#506680" font-weight="400" text-anchor="start">received 对应 Go 语法的 ok；关闭但未读空时，仍然可以收到有效值。</text>
<rect x="42" y="135" width="435" height="70" rx="14" fill="#edf4ff" stroke="#2463c5" stroke-width="2"/><text x="259.5" y="178" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">channel 是 nil？</text><polyline points="477,170 535,170" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="498" y="158" font-size="18" fill="#506680" font-weight="400" text-anchor="start">是</text><rect x="550" y="135" width="500" height="70" rx="14" fill="#edf4ff" stroke="#2463c5" stroke-width="2"/><text x="800" y="162" font-size="22" fill="#172b4d" font-weight="600" text-anchor="middle">阻塞模式：永久等待</text><text x="800" y="194" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">非阻塞模式：返回 (false, false)</text><polyline points="260,205 260,250" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="236" font-size="19" fill="#506680" font-weight="400" text-anchor="start">否：进入加锁主路径</text><rect x="42" y="255" width="435" height="70" rx="14" fill="#fff0f2" stroke="#b43547" stroke-width="2"/><text x="259.5" y="298" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">已经关闭且缓冲区为空？</text><polyline points="477,290 535,290" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="498" y="278" font-size="18" fill="#506680" font-weight="400" text-anchor="start">是</text><rect x="550" y="255" width="500" height="70" rx="14" fill="#fff0f2" stroke="#b43547" stroke-width="2"/><text x="800" y="282" font-size="22" fill="#172b4d" font-weight="600" text-anchor="middle">将接收位置置零，解锁</text><text x="800" y="314" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">返回 (selected=true, received=false)</text><polyline points="260,325 260,370" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="356" font-size="19" fill="#506680" font-weight="400" text-anchor="start">否</text><rect x="42" y="375" width="435" height="70" rx="14" fill="#eaf7f1" stroke="#15765c" stroke-width="2"/><text x="259.5" y="418" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">未关闭且 sendq 有等待者？</text><polyline points="477,410 535,410" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="498" y="398" font-size="18" fill="#506680" font-weight="400" text-anchor="start">是</text><rect x="550" y="375" width="500" height="70" rx="14" fill="#eaf7f1" stroke="#15765c" stroke-width="2"/><text x="800" y="402" font-size="22" fill="#172b4d" font-weight="600" text-anchor="middle">无缓冲：直接交接；有缓冲：取旧补新</text><text x="800" y="434" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">解锁，标记成功并唤醒发送者</text><polyline points="260,445 260,490" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="476" font-size="19" fill="#506680" font-weight="400" text-anchor="start">否</text><rect x="42" y="495" width="435" height="70" rx="14" fill="#f3edfb" stroke="#754cad" stroke-width="2"/><text x="259.5" y="538" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">缓冲区还有值？</text><polyline points="477,530 535,530" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="498" y="518" font-size="18" fill="#506680" font-weight="400" text-anchor="start">是</text><rect x="550" y="495" width="500" height="70" rx="14" fill="#f3edfb" stroke="#754cad" stroke-width="2"/><text x="800" y="522" font-size="22" fill="#172b4d" font-weight="600" text-anchor="middle">取出并清零 buf[recvx]，推进 recvx</text><text x="800" y="554" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">qcount--，解锁，返回 (true, true)</text><polyline points="260,565 260,610" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="596" font-size="19" fill="#506680" font-weight="400" text-anchor="start">否</text><rect x="42" y="615" width="435" height="70" rx="14" fill="#edf4ff" stroke="#2463c5" stroke-width="2"/><text x="259.5" y="658" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">当前是非阻塞尝试？</text><polyline points="477,650 535,650" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="498" y="638" font-size="18" fill="#506680" font-weight="400" text-anchor="start">是</text><rect x="550" y="615" width="500" height="70" rx="14" fill="#edf4ff" stroke="#2463c5" stroke-width="2"/><text x="800" y="658" font-size="22" fill="#172b4d" font-weight="600" text-anchor="middle">解锁，返回 (false, false)</text><polyline points="260,685 260,730" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="716" font-size="19" fill="#506680" font-weight="400" text-anchor="start">否：需要等待</text><rect x="42" y="750" width="1008" height="95" rx="14" fill="#fff2e3" stroke="#a75317" stroke-width="2"/><text x="546" y="789.5" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">接收位置记入 sudog → 进入 recvq → gopark</text><text x="546" y="821.5" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">通过 chanparkcommit 释放锁，等待发送或关闭</text><polyline points="310,845 310,890" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="780,845 780,890" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="42" y="898" width="476" height="72" rx="14" fill="#eaf7f1" stroke="#15765c" stroke-width="2"/><text x="280" y="942" font-size="22" fill="#172b4d" font-weight="600" text-anchor="middle">收到有效值：received = true</text><rect x="574" y="898" width="476" height="72" rx="14" fill="#fff0f2" stroke="#b43547" stroke-width="2"/><text x="812" y="942" font-size="21" fill="#172b4d" font-weight="600" text-anchor="middle">关闭解除等待：零值，received = false</text>
<text x="40" y="1016" font-size="17" fill="#506680" font-weight="400" text-anchor="start">Go 1.26.4 · 普通 channel 主干流程 · 原创示意图</text>
</g></svg>
