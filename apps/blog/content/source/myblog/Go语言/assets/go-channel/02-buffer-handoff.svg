<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="754" viewBox="0 0 1040 754" role="img" aria-labelledby="title desc">
<title id="title">满缓冲区：先读旧值，再给等待发送者补位</title><desc id="desc">容量为三，A B C 已入队，D 的发送者等待。接收者取得 A，D 补入槽位零，逻辑顺序为 B C D，数量保持三。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#a5b7cc"/></marker></defs>
<rect width="100%" height="100%" rx="20" fill="#f8fbff"/>
<g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<text x="40" y="58" font-size="34" fill="#172b4d" font-weight="700" text-anchor="start">满缓冲区：先读旧值，再给等待发送者补位</text><text x="40" y="97" font-size="21" fill="#506680" font-weight="400" text-anchor="start">接收者取得 A，不会越过队头直接取得新来的 D。</text>
<text x="42" y="155" font-size="26" fill="#172b4d" font-weight="600" text-anchor="start">① 初始：容量 3，缓冲区已满</text><rect x="42" y="180" width="126" height="95" rx="14" fill="#f3edfb" stroke="#754cad" stroke-width="2"/><text x="105" y="235.5" font-size="32" fill="#172b4d" font-weight="600" text-anchor="middle">A</text><text x="105" y="307" font-size="20" fill="#506680" font-weight="400" text-anchor="middle">槽位 0</text><rect x="186" y="180" width="126" height="95" rx="14" fill="#f3edfb" stroke="#754cad" stroke-width="2"/><text x="249" y="235.5" font-size="32" fill="#172b4d" font-weight="600" text-anchor="middle">B</text><text x="249" y="307" font-size="20" fill="#506680" font-weight="400" text-anchor="middle">槽位 1</text><rect x="330" y="180" width="126" height="95" rx="14" fill="#f3edfb" stroke="#754cad" stroke-width="2"/><text x="393" y="235.5" font-size="32" fill="#172b4d" font-weight="600" text-anchor="middle">C</text><text x="393" y="307" font-size="20" fill="#506680" font-weight="400" text-anchor="middle">槽位 2</text><text x="42" y="350" font-size="23" fill="#754cad" font-weight="600" text-anchor="start">recvx = sendx = 0，qcount = 3</text><rect x="610" y="180" width="370" height="95" rx="14" fill="#fff2e3" stroke="#a75317" stroke-width="2"/><text x="795" y="235.5" font-size="23" fill="#172b4d" font-weight="600" text-anchor="middle">D 的发送者等待在 sendq</text><polyline points="610,227 500,227" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="548" y="320" font-size="21" fill="#506680" font-weight="400" text-anchor="start">暂时不能入队</text><polyline points="42,227 20,227 20,390 340,390" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="355" y="362" width="310" height="64" rx="14" fill="#eaf7f1" stroke="#15765c" stroke-width="2"/><text x="510" y="402" font-size="23" fill="#172b4d" font-weight="600" text-anchor="middle">② A 交给当前接收者</text><text x="42" y="475" font-size="26" fill="#172b4d" font-weight="600" text-anchor="start">③ D 补入刚腾出的槽位，再唤醒发送者</text><rect x="42" y="504" width="126" height="95" rx="14" fill="#fff2e3" stroke="#a75317" stroke-width="2"/><text x="105" y="559.5" font-size="32" fill="#172b4d" font-weight="600" text-anchor="middle">D</text><text x="105" y="627" font-size="20" fill="#506680" font-weight="400" text-anchor="middle">槽位 0</text><rect x="186" y="504" width="126" height="95" rx="14" fill="#f3edfb" stroke="#754cad" stroke-width="2"/><text x="249" y="559.5" font-size="32" fill="#172b4d" font-weight="600" text-anchor="middle">B</text><text x="249" y="627" font-size="20" fill="#506680" font-weight="400" text-anchor="middle">槽位 1</text><rect x="330" y="504" width="126" height="95" rx="14" fill="#f3edfb" stroke="#754cad" stroke-width="2"/><text x="393" y="559.5" font-size="32" fill="#172b4d" font-weight="600" text-anchor="middle">C</text><text x="393" y="627" font-size="20" fill="#506680" font-weight="400" text-anchor="middle">槽位 2</text><rect x="580" y="500" width="400" height="135" rx="14" fill="#edf4ff" stroke="#2463c5" stroke-width="2"/><text x="780" y="543.5" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">逻辑顺序：B → C → D</text><text x="780" y="575.5" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">recvx = sendx = 1</text><text x="780" y="607.5" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">qcount 仍然为 3</text><text x="42" y="690" font-size="23" fill="#506680" font-weight="400" text-anchor="start">满队列的队头和队尾映射到同一物理槽位；取出一个、补入一个。</text>
<text x="40" y="730" font-size="17" fill="#506680" font-weight="400" text-anchor="start">Go 1.26.4 · 普通 channel 主干流程 · 原创示意图</text>
</g></svg>
