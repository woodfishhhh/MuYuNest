<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="837" viewBox="0 0 1100 837" role="img" aria-labelledby="title desc">
<title id="title">关闭：标记状态，解除等待，保留缓冲值</title><desc id="desc">关闭时先检查并标记 closed，收集接收和发送等待者，释放锁后唤醒。接收者得到零值和 false，发送者恢复后 panic，缓冲值保留。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#a5b7cc"/></marker></defs>
<rect width="100%" height="100%" rx="20" fill="#f8fbff"/>
<g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<text x="40" y="58" font-size="34" fill="#172b4d" font-weight="700" text-anchor="start">关闭：标记状态，解除等待，保留缓冲值</text><text x="40" y="97" font-size="21" fill="#506680" font-weight="400" text-anchor="start">close 不销毁 channel；后续发送会 panic，已入队的值仍可接收。</text>
<rect x="42" y="137" width="1008" height="82" rx="14" fill="#edf4ff" stroke="#2463c5" stroke-width="2"/><text x="546" y="170" font-size="23" fill="#172b4d" font-weight="600" text-anchor="middle">nil → panic；否则加锁，检查是否重复关闭</text><text x="546" y="202" font-size="23" fill="#172b4d" font-weight="400" text-anchor="middle">重复关闭 → 解锁并 panic；首次关闭 → closed = 1</text><polyline points="290,219 290,267" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="800,219 800,267" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="42" y="280" width="476" height="145" rx="14" fill="#eaf7f1" stroke="#15765c" stroke-width="2"/><text x="280" y="328.5" font-size="23" fill="#172b4d" font-weight="600" text-anchor="middle">取出 recvq 等待节点</text><text x="280" y="360.5" font-size="23" fill="#172b4d" font-weight="400" text-anchor="middle">接收位置置零，success = false</text><text x="280" y="392.5" font-size="23" fill="#172b4d" font-weight="400" text-anchor="middle">对应 goroutine 加入唤醒列表</text><rect x="574" y="280" width="476" height="145" rx="14" fill="#fff2e3" stroke="#a75317" stroke-width="2"/><text x="812" y="328.5" font-size="23" fill="#172b4d" font-weight="600" text-anchor="middle">取出 sendq 等待节点</text><text x="812" y="360.5" font-size="23" fill="#172b4d" font-weight="400" text-anchor="middle">解除数据引用，success = false</text><text x="812" y="392.5" font-size="23" fill="#172b4d" font-weight="400" text-anchor="middle">对应 goroutine 加入唤醒列表</text><polyline points="290,425 290,466 546,466 546,494" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="800,425 800,466 546,466" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="280" y="505" width="532" height="82" rx="14" fill="#edf4ff" stroke="#2463c5" stroke-width="2"/><text x="546" y="538" font-size="23" fill="#172b4d" font-weight="600" text-anchor="middle">释放 channel 锁</text><text x="546" y="570" font-size="23" fill="#172b4d" font-weight="400" text-anchor="middle">再统一 goready：让等待者变为可运行</text><polyline points="405,587 405,625" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="700,587 700,625" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="42" y="638" width="476" height="72" rx="14" fill="#eaf7f1" stroke="#15765c" stroke-width="2"/><text x="280" y="682" font-size="23" fill="#172b4d" font-weight="600" text-anchor="middle">等待接收者：零值，ok = false</text><rect x="574" y="638" width="476" height="72" rx="14" fill="#fff0f2" stroke="#b43547" stroke-width="2"/><text x="812" y="682" font-size="23" fill="#172b4d" font-weight="600" text-anchor="middle">等待发送者：恢复后 panic</text><text x="42" y="768" font-size="22" fill="#754cad" font-weight="600" text-anchor="start">缓冲区原有数据保留：先按 FIFO 读完，之后的接收才返回零值与 false。</text>
<text x="40" y="813" font-size="17" fill="#506680" font-weight="400" text-anchor="start">Go 1.26.4 · 普通 channel 主干流程 · 原创示意图</text>
</g></svg>
