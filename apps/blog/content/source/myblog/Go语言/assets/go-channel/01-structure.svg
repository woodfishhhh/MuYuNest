<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="748" viewBox="0 0 1100 748" role="img" aria-labelledby="title desc">
<title id="title">Channel = 状态 + 缓冲区 + 等待队列</title><desc id="desc">hchan 管理环形缓冲区以及 sendq 和 recvq 两个等待队列。sudog 记录 goroutine、数据位置和通信结果。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#a5b7cc"/></marker></defs>
<rect width="100%" height="100%" rx="20" fill="#f8fbff"/>
<g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<text x="40" y="58" font-size="34" fill="#172b4d" font-weight="700" text-anchor="start">Channel = 状态 + 缓冲区 + 等待队列</text><text x="40" y="97" font-size="21" fill="#506680" font-weight="400" text-anchor="start">图中展示结构关系；同一 channel 的两个等待队列不一定同时有节点。</text>
<rect x="40" y="143" width="250" height="96" rx="14" fill="#edf4ff" stroke="#2463c5" stroke-width="2"/><text x="165" y="183" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">channel 值 ch</text><text x="165" y="215" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">关联同一个 hchan</text><polyline points="290,191 340,191" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="340" y="143" width="365" height="252" rx="14" fill="#edf4ff" stroke="#2463c5" stroke-width="2"/><text x="522.5" y="213" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">hchan</text><text x="522.5" y="245" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">qcount · dataqsiz</text><text x="522.5" y="277" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">buf · elemsize · elemtype</text><text x="522.5" y="309" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">sendx · recvx · closed</text><text x="522.5" y="341" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">sendq · recvq · lock</text><polyline points="705,235 765,235" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="765" y="143" width="295" height="190" rx="14" fill="#f3edfb" stroke="#754cad" stroke-width="2"/><text x="912.5" y="214" font-size="22" fill="#172b4d" font-weight="600" text-anchor="middle">buf：环形缓冲区</text><text x="912.5" y="246" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">保存已发送、未取走的值</text><text x="912.5" y="278" font-size="22" fill="#172b4d" font-weight="400" text-anchor="middle">容量为 0 时无数据槽位</text><polyline points="420,395 420,445 215,445 215,483" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="620,395 620,445 805,445 805,483" fill="none" stroke="#a5b7cc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="483" width="365" height="115" rx="14" fill="#fff2e3" stroke="#a75317" stroke-width="2"/><text x="222.5" y="532.5" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">sendq：等待发送</text><text x="222.5" y="564.5" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">sudog → sudog → …</text><rect x="615" y="483" width="445" height="115" rx="14" fill="#eaf7f1" stroke="#15765c" stroke-width="2"/><text x="837.5" y="532.5" font-size="24" fill="#172b4d" font-weight="600" text-anchor="middle">recvq：等待接收</text><text x="837.5" y="564.5" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">sudog → sudog → …</text><text x="42" y="645" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">每个 sudog 记录：g（谁在等）、elem（数据位置）、c（等哪个 channel）</text><text x="42" y="684" font-size="22" fill="#506680" font-weight="400" text-anchor="start">success 区分通信成功与关闭解除等待；一个 select 可拥有多个等待节点。</text>
<text x="40" y="724" font-size="17" fill="#506680" font-weight="400" text-anchor="start">Go 1.26.4 · 普通 channel 主干流程 · 原创示意图</text>
</g></svg>
