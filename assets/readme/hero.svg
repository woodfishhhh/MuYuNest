    <path d="M40 76 198 34 300 126 246 278 92 302 14 184Z" opacity=".9"/>
    <path d="M104 116 212 88 256 158 214 234 114 250 62 182Z" opacity=".75"/>
    <path d="M40 76 104 116M198 34 212 88M300 126 256 158M246 278 214 234M92 302 114 250M14 184 62 182"
