      <circle cx="198" cy="34" r="5"/>
      <circle cx="300" cy="126" r="5"/>
      <circle cx="246" cy="278" r="5"/>
      <circle cx="92" cy="302" r="5"/>
      <circle cx="14" cy="184" r="5"/>
      <circle cx="104" cy="116" r="4"/>
      <circle cx="212" cy="88" r="4"/>
      <circle cx="256" cy="158" r="4"/>
      <circle cx="214" cy="234" r="4"/>
