    <circle cx="222" cy="46" r="1" opacity=".35"/>
    <circle cx="391" cy="76" r="1.5" opacity=".4"/>
    <circle cx="548" cy="42" r="1" opacity=".3"/>
    <circle cx="727" cy="82" r="1.5" opacity=".45"/>
    <circle cx="864" cy="44" r="1" opacity=".35"/>
    <circle cx="1074" cy="73" r="1.5" opacity=".5"/>
    <circle cx="1141" cy="182" r="1" opacity=".3"/>
    <circle cx="76" cy="245" r="1" opacity=".3"/>
    <circle cx="1110" cy="332" r="1.5" opacity=".4"/>
